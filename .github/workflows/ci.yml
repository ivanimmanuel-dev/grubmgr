name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal tools)"
      - run: go mod download
      - run: go mod verify
      - run: go run ./tools/checklicenses
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Linux race detection
        if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go build ./cmd/...
      - name: Build and inspect Linux packages
        if: runner.os == 'Linux'
        run: |
          python3 scripts/build-deb.py --output work/debian
          python3 scripts/check-deb.py work/debian/*.deb
          python3 scripts/build-arch.py --deb work/debian/*.deb --output work/arch
          python3 scripts/check-arch.py work/arch/*.pkg.tar.xz
          python3 -m py_compile scripts/*.py scripts/vm/*.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: grubmgr-debian-amd64
          path: |
            work/debian/*.deb
            work/debian/*.sha256
            work/debian/*.manifest.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: grubmgr-arch-x86_64
          path: |
            work/arch/*.pkg.tar.xz
            work/arch/*.sha256
            work/arch/*.manifest.json
